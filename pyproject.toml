[project]
name = "skrybe-studio"
version = "0.2.0"
description = "A desktop-first creative operating system for writers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All rights reserved" }
authors = [{ name = "adeptus-craftmatica" }]
dependencies = [
    "PySide6>=6.7,<7.0",
    "SQLAlchemy>=2.0,<3.0",
    "pydantic>=2.7,<3.0",
    "alembic>=1.13,<2.0",
    "platformdirs>=4.2,<5.0",
    "python-docx>=1.1,<2.0",
]

[project.urls]
Homepage = "https://github.com/adeptus-craftmatica/skrybe-studio"
Repository = "https://github.com/adeptus-craftmatica/skrybe-studio"

[project.scripts]
skrybe-studio = "skrybe_studio.app.main:main"
skrybe-plugin-host = "skrybe_studio.plugin_host.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skrybe_studio"]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-qt>=4.4,<5.0",
    "ruff>=0.5,<1.0",
    "pyright>=1.1,<2.0",
]
build = [
    "pyinstaller>=6.10,<7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["skrybe_studio"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
qt_api = "pyside6"
filterwarnings = ["ignore::DeprecationWarning"]

name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            artifact: SkrybeStudio.dmg
          - os: windows-latest
            label: Windows
            artifact: SkrybeStudio.zip
          - os: ubuntu-latest
            label: Linux
            artifact: SkrybeStudio.tar.gz

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install dependencies
        run: uv sync --group build

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build with PyInstaller
        run: uv run pyinstaller SkrybeStudio.spec --noconfirm

      - name: Package (macOS → DMG)
        if: runner.os == 'macOS'
        run: |
          create-dmg \
            --volname "Skrybe Studio" \
            --window-pos 200 140 \
            --window-size 660 400 \
            --icon-size 120 \
            --icon "SkrybeStudio.app" 180 170 \
            --hide-extension "SkrybeStudio.app" \
            --app-drop-link 480 170 \
            --no-internet-enable \
            dist/SkrybeStudio.dmg \
            dist/SkrybeStudio.app || \
          hdiutil create \
            -volname "Skrybe Studio" \
            -srcfolder dist/SkrybeStudio.app \
            -ov -format UDZO \
            dist/SkrybeStudio.dmg

      - name: Package (Windows → ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\SkrybeStudio\* -DestinationPath dist\SkrybeStudio.zip

      - name: Package (Linux → tar.gz)
        if: runner.os == 'Linux'
        run: tar -czf dist/SkrybeStudio.tar.gz -C dist SkrybeStudio

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkrybeStudio-${{ matrix.label }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Skrybe Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/SkrybeStudio-macOS/SkrybeStudio.dmg
            artifacts/SkrybeStudio-Windows/SkrybeStudio.zip
            artifacts/SkrybeStudio-Linux/SkrybeStudio.tar.gz
